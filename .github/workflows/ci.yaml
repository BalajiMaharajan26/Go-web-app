```yaml
name: CI/CD

# Run the workflow when application-related files are pushed to main.
# Helm/Kubernetes-only changes are ignored so the automatic Helm tag update
# does not trigger the pipeline again.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:

  # --------------------------------------------------
  # 1. BUILD AND TEST
  # --------------------------------------------------
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Build Go application
        run: go build -o go-web-app .

      - name: Run tests
        run: go test ./...


  # --------------------------------------------------
  # 2. CODE QUALITY
  # --------------------------------------------------
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.56.2


  # --------------------------------------------------
  # 3. BUILD AND PUSH DOCKER IMAGE
  # --------------------------------------------------
  push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - build
      - code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{ github.run_id }}
            ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:latest


  # --------------------------------------------------
  # 4. UPDATE HELM IMAGE TAG
  # --------------------------------------------------
  update-newtag-in-helm-chart:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest

    needs:
      - push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Update image tag in Helm values
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/go-web-app-chart/values.yaml

      - name: Check updated Helm values
        run: |
          echo "Updated values.yaml:"
          cat helm/go-web-app-chart/values.yaml

      - name: Commit and push Helm tag update
        run: |
          git config --global user.email "balajimaharajank@gmail.com"
          git config --global user.name "BalajiMaharajan26"

          git add helm/go-web-app-chart/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update image tag to ${{ github.run_id }}"
          git push
```

